<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
    <filter id="glowX">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowO">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="35" y1="18" x2="35" y2="82" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="18" x2="65" y2="82" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="35" x2="82" y2="35" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="65" x2="82" y2="65" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- X in top-left cell -->
  <line x1="22" y1="22" x2="31" y2="31" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" filter="url(#glowX)"/>
  <line x1="31" y1="22" x2="22" y2="31" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" filter="url(#glowX)"/>
  <!-- O in center cell -->
  <circle cx="50" cy="50" r="7" stroke="#fb7185" stroke-width="4" fill="none" filter="url(#glowO)"/>
  <!-- X in bottom-right cell -->
  <line x1="69" y1="69" x2="78" y2="78" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" filter="url(#glowX)"/>
  <line x1="78" y1="69" x2="69" y2="78" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" filter="url(#glowX)"/>
  <!-- AI brain dots (bottom-right corner) -->
  <circle cx="82" cy="84" r="2" fill="rgba(168,85,247,0.8)"/>
  <circle cx="88" cy="80" r="1.5" fill="rgba(168,85,247,0.6)"/>
  <circle cx="86" cy="88" r="1.5" fill="rgba(168,85,247,0.6)"/>
</svg>
